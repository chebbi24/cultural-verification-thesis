# Final experiment configuration
# Frozen for Bachelor thesis experiments

experiment:
  name: vericult_final
  dataset_plan:
    external_benchmark_items: 120
    redteam_items: 90
    plt_best_of4_items: 30
    total_items: 240

vericult:
  semantic_backbone: Qwen3.6-35B-A3B
  temperature: 0.0
  max_material_targets: 3
  verification_questions_per_target: 2
  retrieval_top_k: 3
  max_rounds: 2
  retrieval_provider: Tavily
  execution:
    acquisition: LIVE
    evaluation: REPLAY
  dimension_scale:
    - 0
    - 1
    - 2
    - abstain
  tie_policy: no_clear_winner
  evidence_policy:
    candidate_blind_retrieval: true
    freeze_memo_before_candidate_comparison: true

direct_llm_judge:
  model: gpt-4.1-2025-04-14
  temperature: 0.0
  tie_policy: no_clear_winner

reward_model:
  model: Skywork/Skywork-Reward-Gemma-2-27B-v0.2
  deterministic_forward_pass: true
  tie_policy: no_clear_winner

candidate_generation:
  model: Qwen3.6-35B-A3B
  temperature: 0.7
  top_p: 1.0

frozen_redteam:
  path: data/final/vericult_redteam_90_final_selection.csv
  manifest: data/final/vericult_redteam_90_freeze_manifest.txt
