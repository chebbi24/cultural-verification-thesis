name: Build external cultural challenge

on:
  push:
    branches:
      - experiment/external-challenge-30x3
    paths:
      - "scripts/build_external_challenge_30x3.py"
      - ".github/workflows/build-external-challenge.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install selection dependencies
        run: python -m pip install --upgrade pip "datasets>=3.0" pandas pyarrow requests openpyxl

      - name: Build 30x3 challenge set
        run: python scripts/build_external_challenge_30x3.py

      - name: Commit frozen source selection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external_challenge
          git commit -m "[generated-external] Build blinded 30x3 cultural challenge set"
          git push origin HEAD:${GITHUB_REF_NAME}
