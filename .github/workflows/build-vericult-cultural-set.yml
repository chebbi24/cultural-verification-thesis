name: Build Vericult cultural prompt set

on:
  push:
    branches:
      - agent/final-experiment-ready
    paths:
      - '.github/workflows/build-vericult-cultural-set.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-experiment-ready
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet datasets pandas pyarrow requests huggingface_hub
      - name: Build exact source-backed files
        run: python scripts/build_vericult_cultural_set.py
      - name: Validate counts
        run: |
          test "$(grep -Ec '^RECORD [0-9]{3}$' vericult_cultural_prompts_120_exact.txt)" = "120"
          test "$(grep -Ec '^RECORD [0-9]{3}$' vericult_cultural_prompts_140_all7_exact.txt)" = "140"
      - name: Commit generated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vericult_cultural_prompts_120_exact.txt vericult_cultural_prompts_140_all7_exact.txt
          git commit -m "Generate exact cultural prompt-response evaluation sets"
          git push origin HEAD:agent/final-experiment-ready
      - uses: actions/upload-artifact@v4
        with:
          name: vericult-cultural-prompt-sets
          path: |
            vericult_cultural_prompts_120_exact.txt
            vericult_cultural_prompts_140_all7_exact.txt
