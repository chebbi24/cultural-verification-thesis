name: Verifier tests

on:
  push:
    branches:
      - agent/clean-standalone-verifier
      - agent/final-verifier
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Ruff lint
        run: ruff check src/cultverify scripts tests
      - name: Ruff format
        run: ruff format --check src/cultverify scripts tests
