[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "german-cultural-verifier"
version = "0.2.0"
description = "Germany-first cultural reward-model benchmark and evidence verifier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.99.0",
]

[project.optional-dependencies]
reward = [
  "accelerate>=1.0",
  "torch>=2.2",
  "transformers>=4.51",
]
dev = [
  "ruff>=0.9",
]

[project.scripts]
cultural-verifier = "cultural_verifier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
