[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cultverify"
version = "1.0.0"
description = "Standalone evidence-grounded cultural verification"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9,<1"]
rm = ["torch>=2.2", "transformers>=4.51", "accelerate>=1.2"]

[project.scripts]
cultverify = "cultverify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cultverify*"]

[tool.setuptools.package-data]
cultverify = ["resources/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["live: explicitly opted-in live provider smoke test"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
